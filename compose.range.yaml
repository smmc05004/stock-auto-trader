services:
  range:
    build:
      context: .
      dockerfile: Dockerfile.paper
    image: stock-auto-trader-range:local
    env_file:
      - ./deploy/paper.env
      - ./deploy/range.env
    environment:
      BROKER_PROVIDER: kis
      TRADING_MODE: paper
      ALLOW_LIVE_TRADING: "false"
      KIS_BASE_URL: ""
      KIS_TOKEN_CACHE_PATH: /app/data/kis-token.json
      RANGE_DB_PATH: /app/data/range.sqlite
    command: [node, range-runner.cjs]
    volumes:
      - range-data:/app/data
    ports:
      - "127.0.0.1:8787:8787"
    restart: unless-stopped
    stop_grace_period: 180s
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
volumes:
  range-data:
